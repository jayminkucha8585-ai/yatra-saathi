{"name": "Make app icons", "on": {"push": {"paths": ["icon.svg", ".github/workflows/icons.yml"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"icons": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"run": "sudo apt-get update && sudo apt-get install -y librsvg2-bin"}, {"run": "for s in 48 72 96 144 180 192 512; do rsvg-convert -w $s -h $s icon.svg -o icon-$s.png; done; cp icon-512.png icon-maskable-512.png; cp icon-192.png icon-maskable-192.png"}, {"run": "git config user.name github-actions && git config user.email github-actions@users.noreply.github.com && git add icon-*.png && (git diff --cached --quiet || (git commit -m \"Make PNG app icons\" && git push))"}]}}}
